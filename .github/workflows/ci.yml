# CI — Darren 승인 2026-07-28 M:d4ao "CI 켜"
#
# ⚠️ 이 레포는 Free 플랜 + private 이라 브랜치 보호를 못 쓴다 → **advisory** 다.
#    빨간불이어도 머지가 막히지 않는다. 얻는 것은 "자동 실행 + 결과 가시화" 이고,
#    강제는 사람이 빨간불을 존중하는 것에 달렸다 ⇒ **헛빨간불을 만들지 않는 것이 전부다.**
#
# 🔴 왜 이 파일이 미추적으로 있었나: `.github/workflows/` push 가 OAuth 스코프 부재로
#    거부됐다는 기억이 있었는데, 2026-07-28 재측정하니 **스코프는 붙어 있었다**
#    (`gh auth status` → repo, workflow, …). 막혀 있던 게 아니라 커밋한 적이 없었다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # PR 마다 초록이어도 머지 후 main 이 빨강일 수 있다(서로 다른 PR 조합)

# 같은 브랜치에 연속 푸시하면 이전 런을 취소한다 — 안 하면 3커밋 = 3런이 끝까지 다 돈다.
#
# 🔴 다만 **main 은 예외다** (2026-08-02, 룬드 실사고에서 옮겨받았다).
#    main 에서 취소하면 다음 머지가 **직전 머지 커밋의 런을 죽인다.** 그 런이 곧
#    원장(`memory/current-tasks.md`)이 읽는 관측값이라, 취소되면 그 행에 **다음
#    커밋의 값을 적게 된다.** 실물: 그의 `aa4a2fe` 첫 런이 그렇게 사라졌고,
#    `gh run watch` 를 안 했으면 모르고 지나갔다("1줄 차이라 아마 맞았겠지만 그건 운이다").
#
# 🔑 조용하다 — 실패가 아니라 `cancelled` 로 남을 뿐이라 아무도 안 본다.
#    PR 쪽 취소는 그대로 둔다(러너 시간). 끄는 건 main 하나뿐이다.
# 🔴 **취소를 끄는 것만으로는 «절반»이었다** (2026-08-10, 룬드 `#68` 에서 옮겨받음).
#    한 concurrency 그룹의 **대기 자리는 하나**라, main 커밋이 전부 같은 그룹이면
#    새 대기가 **앞 대기를 밀어낸다** — `cancel-in-progress` 와 «무관»하게 죽는다.
#    그의 증거: 취소 시각 = 다음 런의 «생성» 시각(같은 초).
# 🔑 내 취소 건수는 0 이었는데 **그 0 이 아무것도 안 말했다** — main 런 간격이 2시간이라
#    한 번도 안 밟혔을 뿐이다(「판정 불가」이지 「수리됨」이 아니다). 발현은 **머지가 몰릴 때**.
#    ⇒ main 은 **sha 로 그룹을 갈라** 커밋마다 자기 자리를 준다. PR 은 공유 그룹 그대로.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # 그대로 둔다

permissions:
  contents: read   # checkout 만 필요

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 러너 기본이 6시간 — 매달리면 한 번에 월 한도를 크게 먹는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🔑 러너가 `bun test` 를 부르는데 CI 에 bun 이 없어서 시험 21개가 **판정 불가**로
      #    떴다(`#132` 머지 `19329d7` 부터, 판불 9→10). 부재를 통과로 안 센 건 설계대로고,
      #    막힌 건 «못 쟀다» 쪽이라 여기서 여는 게 근본이다 — 시험을 지우는 게 아니라 돌린다.
      # 🔴 로컬(WSL·GNU date)에서 먼저 재고 넣는다: `21 pass · 0 fail · rc=0`.
      #    안 재고 넣으면 실패가 0→N 이 될 수 있고, 그건 동결 통과 조건을 «거꾸로» 깬다.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `npm ci` — lockfile 을 무시하면 "로컬 초록 ↔ CI 초록" 이 서로 다른 의존성 위에서 난다
      - run: npm ci

      - run: npm run lint

      # 🔑 시험은 러너로 **한 번에** 돈다 — `npm test`(jest) 만 부르면 `tests/*.test.sh`
      #    16개가 빠진다(2026-07-28 실측). 러너는 0/1/**2(판정 불가)** 를 내고, 그 셋을
      #    CI 의 둘로 옮기는 정책은 `scripts/ci-verdict.sh` **한 곳**에만 있다(시험 21개로 잠김).
      #    여기 인라인으로 쓰면 시험할 수 없고, 조용히 틀려도 아무도 모른다.
      - name: 시험 전체 (셸 + jest)
        run: |
          set +e
          npm run test:all 2>&1 | tee /tmp/test-all.log
          rc=${PIPESTATUS[0]}
          set -e
          bash scripts/ci-verdict.sh --rc "$rc" --out /tmp/test-all.log --min-green 10
